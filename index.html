<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>飛行器互動展間</title>
<style>
:root{color-scheme:dark;--ink:#edf5f7;--muted:#9aadb6;--line:#ffffff20;--panel:#0b1820d9;--cyan:#64d9e8;--gold:#ffc777}*{box-sizing:border-box}body{margin:0;background:#07121a;color:var(--ink);font-family:Inter,"Noto Sans TC",system-ui,sans-serif;overflow:hidden}.scene{position:fixed;inset:0;background:radial-gradient(ellipse at 52% 48%,#18303b 0,#0b1b24 43%,#07121a 82%)}canvas{display:block;width:100%;height:100%;outline:0}.grain{position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.23'/%3E%3C/svg%3E")}.top{position:fixed;top:0;left:0;right:0;padding:28px 4vw;display:flex;align-items:center;justify-content:space-between;z-index:2}.brand{letter-spacing:.16em;font-size:11px;color:var(--cyan);text-transform:uppercase}.top small{color:var(--muted);letter-spacing:.08em}.intro{position:fixed;left:5vw;top:26%;z-index:2;pointer-events:none}.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}.intro h1{font-size:clamp(32px,5vw,64px);line-height:1.08;letter-spacing:.03em;margin:16px 0 12px;font-weight:550}.intro p{color:#afc0c6;font-size:14px;line-height:1.8;max-width:300px}.badge{display:inline-flex;border:1px solid var(--line);padding:8px 11px;border-radius:30px;gap:8px;align-items:center;margin-top:14px;color:#c5d5d9;font-size:11px;letter-spacing:.08em}.dot{width:6px;height:6px;border-radius:50%;background:#6de5be;box-shadow:0 0 10px #6de5be}.panel{position:fixed;right:4vw;top:24%;width:210px;z-index:2;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.panel-title{font-size:10px;letter-spacing:.2em;color:var(--muted);margin-bottom:16px}.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ffffff10;font-size:12px}.stat:last-child{border:0}.stat span{color:var(--muted)}.controls{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:16px;background:#07121acc;backdrop-filter:blur(14px);box-shadow:0 12px 40px #0005}.controls button{color:#d9e5e8;background:transparent;border:0;border-radius:10px;padding:11px 14px;font:inherit;font-size:12px;cursor:pointer;transition:.2s}.controls button:hover,.controls button.active{background:#ffffff14;color:var(--cyan)}.controls .sep{height:22px;border-left:1px solid var(--line)}.hint{position:fixed;bottom:38px;left:4vw;z-index:2;color:#91a5ad;font-size:11px;letter-spacing:.04em}.hint b{color:#d7e5e8;font-weight:500}.loader{position:fixed;inset:0;display:grid;place-items:center;background:#07121a;z-index:9;transition:opacity .5s}.loader.hide{opacity:0;pointer-events:none}.loadbox{text-align:center;width:min(320px,80vw)}.loadname{color:var(--muted);font-size:11px;letter-spacing:.2em;margin-bottom:18px}.track{height:2px;background:#ffffff1a;overflow:hidden}.bar{height:100%;width:0;background:var(--cyan);transition:width .2s}.loadmsg{font-size:12px;color:#b5c5c9;margin-top:14px}.error{color:#ffb4a9;line-height:1.6}.footer{position:fixed;right:4vw;bottom:38px;color:#647983;font-size:10px;letter-spacing:.12em;z-index:2}@media(max-width:760px){.top{padding:20px 6vw}.top small{display:none}.intro{left:6vw;top:17%}.intro h1{font-size:38px}.intro p{font-size:12px;max-width:230px}.panel{right:6vw;top:auto;bottom:112px;width:145px;padding:9px 0}.stat{font-size:10px;padding:7px 0}.panel-title{margin-bottom:8px}.hint{left:6vw;bottom:34px;width:95px;line-height:1.6}.footer{display:none}.controls{bottom:18px;gap:2px;padding:5px}.controls button{padding:10px 9px;font-size:11px}.controls .wide{display:none}}
</style>
</head>
<body>
<div class="scene" id="scene"></div><div class="grain"></div>
<div class="top"><div class="brand">AERONAUTICS · DIGITAL SHOWROOM</div><small>INTERACTIVE 3D MODEL / 01</small></div>
<section class="intro"><div class="eyebrow">AIRCRAFT · 3D STUDY</div><h1>飛行器<br>互動展間</h1><p>以 3D 視角探索機身輪廓。拖曳旋轉、滾輪縮放，從不同角度欣賞模型。</p><div class="badge"><i class="dot"></i> MODEL LOADED</div></section>
<aside class="panel"><div class="panel-title">MODEL DETAILS</div><div class="stat"><span>檔案格式</span><b>FBX</b></div><div class="stat"><span>顯示模式</span><b id="mode">標準</b></div><div class="stat"><span>視角</span><b id="viewName">自由</b></div></aside>
<div class="hint"><b>拖曳</b> 旋轉模型<br><b>滾輪</b> 調整遠近</div>
<div class="controls"><button data-view="free" class="active">自由視角</button><button data-view="front">正面</button><button data-view="side">側面</button><button data-view="top">俯視</button><span class="sep"></span><button id="rotate" class="wide">⟳ 自動旋轉</button><button id="reset">重設</button></div>
<div class="footer">DRAG TO EXPLORE&nbsp;&nbsp; · &nbsp;&nbsp;SCROLL TO ZOOM</div>
<div class="loader" id="loader"><div class="loadbox"><div class="loadname">LOADING AIRCRAFT MODEL</div><div class="track"><div class="bar" id="bar"></div></div><div class="loadmsg" id="loadmsg">正在準備 3D 展間…</div></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const host=document.querySelector('#scene'), loaderEl=document.querySelector('#loader'), bar=document.querySelector('#bar'), msg=document.querySelector('#loadmsg');
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x0b1b24,18,55);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,300);camera.position.set(8,5,10);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb8eaff,0x23303a,2.0));const key=new THREE.DirectionalLight(0xffe3be,3.3);key.position.set(5,9,7);scene.add(key);const rim=new THREE.DirectionalLight(0x46cfe8,2.2);rim.position.set(-7,3,-5);scene.add(rim);const fill=new THREE.DirectionalLight(0xffffff,1.2);fill.position.set(-4,2,6);scene.add(fill);
const ground=new THREE.Mesh(new THREE.CircleGeometry(18,96),new THREE.MeshBasicMaterial({color:0x0d2029,transparent:true,opacity:.72}));ground.rotation.x=-Math.PI/2;ground.position.y=-2.7;scene.add(ground);const grid=new THREE.GridHelper(28,28,0x43818a,0x28505a);grid.position.y=-2.68;grid.material.transparent=true;grid.material.opacity=.2;scene.add(grid);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=2;controls.maxDistance=30;controls.target.set(0,0,0);
let model, baseCamera, auto=false;
new FBXLoader().load('./assets/aircraft-v2.fbx',obj=>{model=obj;model.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;if(Array.isArray(n.material))n.material.forEach(m=>m.side=THREE.DoubleSide);else if(n.material)n.material.side=THREE.DoubleSide;}});const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());model.position.sub(center);const max=Math.max(size.x,size.y,size.z)||1;model.scale.setScalar(7/max);model.position.y=-.25;scene.add(model);const distance=Math.max(6,max*.65);camera.position.set(distance*.8,distance*.45,distance);controls.target.set(0,0,0);controls.update();baseCamera={pos:camera.position.clone(),target:controls.target.clone()};bar.style.width='100%';msg.textContent='模型載入完成';setTimeout(()=>loaderEl.classList.add('hide'),350);},xhr=>{if(xhr.total)bar.style.width=Math.round(xhr.loaded/xhr.total*100)+'%';msg.textContent=xhr.total?'載入模型 '+Math.round(xhr.loaded/xhr.total*100)+'%':'正在載入模型…';},err=>{console.error(err);msg.innerHTML='<span class="error">模型載入失敗。請確認網路連線後重新整理頁面。</span>';});
function setView(name){if(!baseCamera)return;auto=false;document.querySelector('#rotate').classList.remove('active');const d=baseCamera.pos.length();const poses={front:[0,0,d],side:[d,0,0],top:[0,d,0],free:null};if(name==='free'){camera.position.copy(baseCamera.pos);controls.target.copy(baseCamera.target);}else{const p=poses[name];camera.position.set(p[0],p[1],p[2]);controls.target.set(0,0,0);}camera.up.set(0,1,0);if(name==='top')camera.up.set(0,0,-1);camera.lookAt(controls.target);controls.update();document.querySelector('#viewName').textContent={free:'自由',front:'正面',side:'側面',top:'俯視'}[name];document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));document.querySelector('#rotate').addEventListener('click',e=>{auto=!auto;e.currentTarget.classList.toggle('active',auto);controls.autoRotate=auto;controls.autoRotateSpeed=1.2;});document.querySelector('#reset').addEventListener('click',()=>{setView('free');controls.reset();if(baseCamera){camera.position.copy(baseCamera.pos);controls.target.copy(baseCamera.target);controls.update();}});
function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera);}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body></html>
